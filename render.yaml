databases:
  - name: destinos-da-banda-db
    plan: free
    databaseName: destinos_da_banda
    user: destinos_da_banda

services:
  - type: web
    name: destinos-da-banda
    runtime: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: destinos-da-banda-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DASHBOARD_URL
        value: "painel/"
      - key: ADMIN_URL
        value: "django-admin/"
      - key: DJANGO_SUPERUSER_USERNAME
        value: "admin"
      - key: DJANGO_SUPERUSER_EMAIL
        value: "admin@destinosdabanda.ao"
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
